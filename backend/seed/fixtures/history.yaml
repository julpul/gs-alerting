  resolutionNote: 'Same pattern as 22 days ago, different cause: the eligibility lookup was slow because the cache
    had been flushed at 08:00 and the cold cache made each call hit the DB. Raised the client timeout from 5000
    to 8000 ms with the flag counterparty.timeoutMs and ran the cache preload job; timeouts stopped within 5 minutes.
    Retried 12 workflows. TODO: warm the cache on deploy (SET-530).'
