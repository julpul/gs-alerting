# Vistula Capital -- 40 resolved incidents over the last 30 days, seeded by loaders/90_history.py.
#
# Purpose: "fixed before" demo. Several failures repeat on purpose (counterparty TIMEOUT x5, payments-api
# HighErrorRate x4, pricing-engine-3 latency x4, secret_leaked x3, rates rejected trades x5).
#
# Field semantics
#   openedAt      offset relative to seed time (`-12d3h`): alert.first_seen_at = now - offset
#   ackAfter / resolveAfter / timeline[].at   offsets relative to openedAt (`3m`, `1h35m`, `0s`)
#   team, ruleKey, ruleName   team slug and the seeded rule it belongs to (`stable_id("rule", ruleKey)`; falls back
#                 to (team, ruleName))
#   source        seeded source name; `raw` is an event in that source's schema, sent through the production
#                 normalizer to compute the knowledge key (the loader does NOT use type/service/errorCode below,
#                 they are documentation of what the normalizer yields)
#   count         dedup counter of the alert (events folded into it)
#   raw           string values "@openedAt" / "@openedAt:epoch_ms" are replaced by the opened-at timestamp
#   timeline[].actor   user email or `system`; timeline[].type in alert.created | notification.sent |
#                 alert.escalated | alert.acknowledged | comment | action.run | alert.resolved
#   resolvedBy / resolutionNote   become the `resolutions` row (and a `resolution_note` knowledge chunk)
