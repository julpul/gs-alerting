# Vistula Capital (fictional investment bank, Warsaw / London): the demo organization seeded by
# seed/loaders/10_org.py. Ids are uuid5 of slugs / emails. All users have password `demo`.
# Conventions:
#   * keys starting with `x-` only hold YAML anchors, loaders ignore them;
#   * `roles[].scope` is a domain slug, a team slug, or null for org-wide roles; `member` roles also make the
#     user a team member (team_members), which is what the rotations and on-call lookups are built from;
#   * the seven original demo identities (`core: true`) keep their emails, names, phones and scopes; with
#     SEED_PROFILE=core (the test suite) only those are seeded, without preferences;
#   * phones are fake (+48 500 1xx xxx), written compact as in spec section 21;
#   * `rotations` and `systems` are documentation of the intended on-call order (first member on call "now",
#     `startsAt` relative to seed time); the rotation loader builds shifts from team_members;
#   * preferences.workingHours are interpreted in the user's own timezone (the loader stores them as
#     {from, to, timezone}).

x-preferences:
  engineer: &pref_engineer
    bySeverity:
      critical: [phone, sms]
      error: [sms, email]
      warning: [email]
      info: [ui]
    workingHours: &wh_warsaw { start: "08:00", end: "20:00", days: [1, 2, 3, 4, 5] }
  sms_first: &pref_sms_first
    bySeverity:
      critical: [sms, phone]
      error: [sms]
      warning: [email, ui]
      info: [ui]
    workingHours: *wh_warsaw
  lead: &pref_lead
    bySeverity:
      critical: [phone, sms, email]
      error: [sms, email]
      warning: [email]
      info: [ui]
    workingHours: { start: "07:30", end: "19:00", days: [1, 2, 3, 4, 5] }
  informed: &pref_informed
    bySeverity:
      critical: [email, sms]
      error: [email]
      warning: [ui]
      info: [ui]
    workingHours: { start: "08:00", end: "18:00", days: [1, 2, 3, 4, 5] }
  london: &pref_london
    bySeverity:
      critical: [phone, sms]
      error: [sms, email]
      warning: [email]
      info: [ui]
    workingHours: { start: "08:30", end: "18:30", days: [1, 2, 3, 4, 5] }
  new_york: &pref_new_york
    bySeverity:
      critical: [phone, sms]
      error: [email, sms]
      warning: [email]
      info: [ui]
    workingHours: { start: "09:00", end: "18:00", days: [1, 2, 3, 4, 5] }

