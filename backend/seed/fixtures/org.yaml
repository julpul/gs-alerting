# Systems the teams own and how their telemetry reaches us (source names/keys are seeded by P2-RULES).
systems:
  - slug: payments-api
    name: Payments API
    ownerTeam: team-payments
    domain: payments
    description: Card and SEPA payment initiation API, 3 regions (eu-west, eu-central, us-east).
    emits:
      - { source: prometheus, via: alertmanager-webhook, schema: alertmanager, rules: [anna-payments-critical] }
  - slug: order-settlement
    name: order-settlement workflow engine
    ownerTeam: team-settlements
    domain: settlements
    description: Workflow engine that settles matched orders (validate-counterparty, reserve-funds, ledger-commit, send-confirmation).
    emits:
      - { source: workflow-broker, via: webhook, schema: "WORKFLOW_FAILED / WORKFLOW_SUCCEEDED", rules: [settlements-order-settlement-failed] }
  - slug: counterparty-service
    name: counterparty-service
    ownerTeam: team-settlements
    domain: settlements
    description: Reference data and eligibility checks for counterparties; called by validate-counterparty (5 s client timeout).
    emits: []
  - slug: pricing-engine-1
    name: pricing-engine-1
    ownerTeam: team-pricing
    domain: markets
    description: Pricing engine instance (FX majors).
    emits: [{ source: pricing-logs, via: webhook, schema: log-line, rules: [pricing-engine-warnings] }]
  - slug: pricing-engine-2
    name: pricing-engine-2
    ownerTeam: team-pricing
    domain: markets
    description: Pricing engine instance (FX crosses and metals).
    emits: [{ source: pricing-logs, via: webhook, schema: log-line, rules: [pricing-engine-warnings] }]
  - slug: pricing-engine-3
    name: pricing-engine-3
    ownerTeam: team-pricing
    domain: markets
    description: Pricing engine instance (rates curves); the one with the flaky curve cache.
    emits: [{ source: pricing-logs, via: webhook, schema: log-line, rules: [pricing-engine-warnings] }]
  - slug: pricing-engine-4
    name: pricing-engine-4
    ownerTeam: team-pricing
    domain: markets
    description: Pricing engine instance (PLN and CEE products).
    emits: [{ source: pricing-logs, via: webhook, schema: log-line, rules: [pricing-engine-warnings] }]
  - slug: trade-gateway
    name: trade-gateway
    ownerTeam: team-rates
    domain: markets
    description: Order entry and pre-trade risk gateway; publishes accepted/rejected trade events to its own RabbitMQ queue vistula.trade-gateway.
    emits:
      - { source: trade-gateway, via: rabbitmq-connector, schema: "trade.accepted.v1 / trade.rejected.v2", rules: [rates-big-rejected-trades] }
  - slug: pr-review-agent
    name: pr-review-agent
    ownerTeam: team-security
    domain: security
    description: AI agent reviewing pull requests; raises typed security alerts through the public API.
    emits:
      - { source: pr-review-agent, via: raise-api, schema: "typed (security.*)", rules: [security-typed-alerts] }
  - slug: custody-recon
    name: custody reconciliation
    ownerTeam: team-settlements
    domain: settlements
    description: "Not onboarded yet: its schema is unknown to the platform. Used by the new_schema scenario (schema {evt, sev, acct, details})."
    emits: [{ source: custody, via: webhook, schema: "custody.break", rules: [] }]
  - slug: checkout-api
    name: checkout-api
    ownerTeam: checkout-project
    domain: payments
    description: Checkout backend (cross-domain project, Payments + Security). No telemetry onboarded in the demo.
    emits: []
