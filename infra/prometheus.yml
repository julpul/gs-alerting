# Prometheus config for the load tests (docs/TECH_SPEC.md §18/§19, dashboards in infra/grafana).
#
# Runs inside the compose network, so targets are docker service names.
# Metrics ports: api serves /metrics on :8080; worker, delivery, scheduler and ai
# expose a metrics endpoint on :9101 (see loadtest/README.md "Wiring").
global:
  scrape_interval: 2s
  scrape_timeout: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']

  # Replicated roles: DNS service discovery returns every replica of `docker compose --scale`.
  - job_name: worker
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9101
        refresh_interval: 5s

  - job_name: delivery
    dns_sd_configs:
      - names: ['delivery']
        type: A
        port: 9101
        refresh_interval: 5s

  - job_name: scheduler
    static_configs:
      - targets: ['scheduler:9101']

  - job_name: ai
    static_configs:
      - targets: ['ai:9101']

  # RabbitMQ prometheus plugin (rabbitmq_prometheus, port 15692; enabled by default in the
  # rabbitmq:3.13-management image, otherwise `rabbitmq-plugins enable rabbitmq_prometheus`).
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  # Per-queue depth: rabbitmq_detailed_queue_messages_ready{queue="events.in"} etc.
  - job_name: rabbitmq_queues
    metrics_path: /metrics/detailed
    params:
      family: ['queue_coarse_metrics']
    static_configs:
      - targets: ['rabbitmq:15692']

