# Shared dependencies (used by tests and local dev). Start with `make infra-up`.
name: gsalert
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alerting
      POSTGRES_PASSWORD: alerting
      POSTGRES_DB: alerting
    # commit_delay/commit_siblings = group commit: batches WAL fsyncs under concurrent load without giving
    # up durability (unlike synchronous_commit=off). Docker Desktop disk I/O makes this matter a lot.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB", "-c", "commit_delay=200",
              "-c", "commit_siblings=4", "-c", "wal_buffers=16MB", "-c", "max_wal_size=2GB",
              "-c", "checkpoint_timeout=15min", "-c", "wal_compression=on"]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerting -d alerting"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  mockgw:
    build: ../mockgw
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
