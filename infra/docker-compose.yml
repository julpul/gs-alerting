# Full stack: dependencies + all backend roles. Start with `make up`.
name: gsalert
include:
  - docker-compose.deps.yml

x-backend: &backend
  build:
    context: ../backend
    args:
      PRELOAD_EMBEDDINGS: ${PRELOAD_EMBEDDINGS:-1}
  image: gs-alerting-backend
  env_file:
    - path: ../.env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql://alerting:alerting@postgres:5432/alerting
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    MOCKGW_URL: http://mockgw:8090
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    JWT_SECRET: ${JWT_SECRET:-compose-demo-jwt-secret-not-for-production}
    APP_SECRET: ${APP_SECRET:-ZGV2LWFwcC1zZWNyZXQtMzItYnl0ZXMtbG9uZy1rZXkh}
    DEMO_FAST_ESCALATION: ${DEMO_FAST_ESCALATION:-false}
    ENVIRONMENT: local
    # Sign-in (docs/SSO.md): oidc (default here: Vistula ID, our demo SSO, with the password form as the emergency way in) | password | demo.
    AUTH_MODE: ${AUTH_MODE:-oidc}
    OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8180}
    OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://sso:8180/.well-known/openid-configuration}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-herald}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-herald-demo-client-secret-not-for-prod}
    OIDC_LABEL: ${OIDC_LABEL:-Sign in with Vistula ID}
    ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
    ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
    ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
  depends_on: &backend-deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  restart: unless-stopped

services:
  # Vistula ID (sso/): our demo single sign-on, a real OpenID Connect provider. Browsers use localhost:8180, the api
  # calls sso:8180 (the discovery document names back-channel endpoints on the host that was asked).
  sso:
    build: ../sso
    env_file:
      - path: ../.env
        required: false
    environment:
      SSO_ISSUER: ${OIDC_ISSUER:-http://localhost:8180}
      SSO_CLIENT_ID: ${OIDC_CLIENT_ID:-herald}
      SSO_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-herald-demo-client-secret-not-for-prod}
      SSO_REDIRECT_URIS: ${PUBLIC_BASE_URL:-http://localhost:8080}/auth/callback
      PORT: "8180"
    ports: ["8180:8180"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8180/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    environment:
      <<: *backend-env
      APP_ROLE: api
      PORT: "8080"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  seed:
    <<: *backend
    command: ["python", "-m", "seed.seed"]
    restart: "no"
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  worker:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: worker }
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  delivery:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: delivery }
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  scheduler:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: scheduler }
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  ai:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: ai, EMBEDDINGS_THREADS: "2" }
    # The AI worker is asynchronous (ai.tasks queue) and must never starve the hot path on a shared host.
    cpus: 2
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  connector:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: connector }
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  simulator:
    build: ../simulator
    image: gs-alerting-simulator
    ports: ["8095:8095"]
    environment:
      PORT: "8095"
      TARGET_API_URL: http://api:8080
      CUSTOMER_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      BASE_RATE: ${SIM_BASE_RATE:-2}
      AUTO_INCIDENTS: ${SIM_AUTO_INCIDENTS:-true}   # set false while recording the video
      INCIDENTS_PER_HOUR: "2"
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

