# Full stack: dependencies + all backend roles. Start with `make up`.
name: gsalert
include:
  - docker-compose.deps.yml

x-backend: &backend
  build:
    context: ../backend
    args:
      PRELOAD_EMBEDDINGS: ${PRELOAD_EMBEDDINGS:-1}
  image: gs-alerting-backend
  env_file:
    - path: ../.env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql://alerting:alerting@postgres:5432/alerting
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    MOCKGW_URL: http://mockgw:8090
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    JWT_SECRET: ${JWT_SECRET:-compose-demo-jwt-secret-not-for-production}
    APP_SECRET: ${APP_SECRET:-ZGV2LWFwcC1zZWNyZXQtMzItYnl0ZXMtbG9uZy1rZXkh}
    DEMO_FAST_ESCALATION: ${DEMO_FAST_ESCALATION:-false}
    ENVIRONMENT: local
    # Sign-in (docs/SSO.md): password (default here) | oidc | demo. The OIDC defaults point at the demo Keycloak (profile `sso`).
    AUTH_MODE: ${AUTH_MODE:-password}
    OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8180/realms/vistula}
    OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/vistula/.well-known/openid-configuration}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-herald}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-herald-demo-client-secret-not-for-prod}
    OIDC_LABEL: ${OIDC_LABEL:-Continue with SSO}
    ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
    ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
    ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
  depends_on: &backend-deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  restart: unless-stopped

services:
  # Demo identity provider, only with `--profile sso`. Browsers reach it at localhost:8180, the api as keycloak:8080;
  # KC_HOSTNAME keeps one issuer for both. Realm "vistula" = our demo people (infra/keycloak/vistula-realm.json).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [sso]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-vistula-demo}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  api:
    <<: *backend
    environment:
      <<: *backend-env
      APP_ROLE: api
      PORT: "8080"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  seed:
    <<: *backend
    command: ["python", "-m", "seed.seed"]
    restart: "no"
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  worker:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: worker }
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  delivery:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: delivery }
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  scheduler:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: scheduler }
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  ai:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: ai, EMBEDDINGS_THREADS: "2" }
    # The AI worker is asynchronous (ai.tasks queue) and must never starve the hot path on a shared host.
    cpus: 2
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  connector:
    <<: *backend
    environment: { <<: *backend-env, APP_ROLE: connector }
    depends_on:
      <<: *backend-deps
      api: { condition: service_healthy }

  simulator:
    build: ../simulator
    image: gs-alerting-simulator
    ports: ["8095:8095"]
    environment:
      PORT: "8095"
      TARGET_API_URL: http://api:8080
      CUSTOMER_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      BASE_RATE: ${SIM_BASE_RATE:-2}
      AUTO_INCIDENTS: ${SIM_AUTO_INCIDENTS:-true}   # set false while recording the video
      INCIDENTS_PER_HOUR: "2"
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

