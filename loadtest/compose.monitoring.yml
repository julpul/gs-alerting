# Prometheus + Grafana for the load tests, as a standalone compose file that joins the
# network of the main stack (project name `gsalert`):
#
#   docker compose -p gsalert-monitoring -f loadtest/compose.monitoring.yml up -d
#
# Prometheus: http://localhost:9090   Grafana: http://localhost:3001 (admin/admin, anonymous viewer enabled)
# Dashboard "Alerting – load" is provisioned from infra/grafana.
#
# If infra/docker-compose.yml already defines `prometheus` / `grafana` services with the same ports,
# use those instead and do not start this file (they mount the same infra/ files).
name: gsalert-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ../infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    networks: [gsalert]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'
    depends_on: [prometheus]
    networks: [gsalert]

networks:
  gsalert:
    name: gsalert_default
    external: true
